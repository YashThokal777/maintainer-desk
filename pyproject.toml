[project]
name = "maintainer-desk"
version = "0.1.0"
description = "A Switch room group where AI agents and maintainers triage and review a GitHub repo together, in team chat."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27",
  "websockets>=12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
desk-watcher = "desk_watcher.__main__:main"
desk-agent = "desk_agents.__main__:main"
desk-post = "desk_agents.__main__:post_main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["desk_watcher*", "desk_agents*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
